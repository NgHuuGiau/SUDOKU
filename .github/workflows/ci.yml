name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff
        run: |
          python -m ruff check . --output-format=github

      - name: Run mypy
        run: |
          python -m mypy . --ignore-missing-imports

  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pip-audit detect-secrets==1.5.0

      - name: Audit dependencies
        run: pip-audit --local

      - name: Scan tracked files for secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: [test, lint, security]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executable
        run: |
          pyinstaller build.spec --clean

      - name: Smoke test executable
        run: .\dist\SudokuMaster.exe --smoke-test
        env:
          SDL_VIDEODRIVER: dummy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudokuMaster-windows
          path: dist/SudokuMaster.exe
          retention-days: 30

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executable
        run: |
          pyinstaller build.spec --clean

      - name: Smoke test executable
        run: ./dist/SudokuMaster --smoke-test
        env:
          SDL_VIDEODRIVER: dummy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudokuMaster-linux
          path: dist/SudokuMaster
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SudokuMaster-windows
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SudokuMaster-linux
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sudoku Master ${{ github.ref_name }}
          body: |
            Phát hành Sudoku Master ${{ github.ref_name }}.

            ## Downloads
            - Windows: `SudokuMaster.exe`
            - Linux: `SudokuMaster`
          files: |
            artifacts/windows/SudokuMaster.exe
            artifacts/linux/SudokuMaster
          draft: false
          prerelease: false

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test, lint, security, build-windows, build-linux, release]
    steps:
      - name: Summarize results
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          {
            echo '## CI Summary'
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "| Tests | $TEST_RESULT |"
            echo "| Lint & type check | $LINT_RESULT |"
            echo "| Security & secret scan | $SECURITY_RESULT |"
            echo "| Windows build & smoke test | $WINDOWS_RESULT |"
            echo "| Linux build & smoke test | $LINUX_RESULT |"
            echo "| Release | $RELEASE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$TEST_RESULT" "$LINT_RESULT" "$SECURITY_RESULT"; do
            if [ "$result" != success ]; then
              exit 1
            fi
          done

          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            for result in "$WINDOWS_RESULT" "$LINUX_RESULT"; do
              if [ "$result" != success ]; then
                exit 1
              fi
            done
          fi

          if [ "$RELEASE_RESULT" = failure ] || [ "$RELEASE_RESULT" = cancelled ]; then
            exit 1
          fi
